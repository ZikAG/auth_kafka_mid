version: '3.9'

networks:
  kafka-net:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  kafka-logs:
  kafka-plugins:

services:
  # ─── Java Plugin Builder ────────────────────────────────────────────────────
  plugin-builder:
    build:
      context: ./custom-plugins
      dockerfile: Dockerfile
    volumes:
      - kafka-plugins:/plugins
    networks:
      - kafka-net
    restart: "no"

  # ─── PostgreSQL for Keycloak ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Keycloak IAM ──────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    platform: linux/arm64
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_FEATURES: "token-exchange,admin-fine-grained-authz"
      KC_LOG_LEVEL: INFO
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 20s
      timeout: 15s
      retries: 25
      start_period: 120s

  # ─── Apache Kafka (KRaft mode) ──────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.1
    platform: linux/arm64
    hostname: kafka
    entrypoint: ["/bin/bash", "/opt/kafka-scripts/start.sh"]
    environment:
      # JMX (processed by kafka-run-class.sh, not the configure script)
      JMX_PORT: "9101"
      KAFKA_JMX_HOSTNAME: kafka
      # Plugin JAR on the classpath
      CLASSPATH: /opt/kafka/plugins/*

    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-logs:/opt/kafka/logs
      - kafka-plugins:/opt/kafka/plugins
      - ./config/kafka/server.properties:/opt/kafka/config/kraft/server.properties:ro
      - ./config/kafka/log4j.properties:/opt/kafka/config/log4j.properties:ro
      - ./config/kafka/start.sh:/opt/kafka-scripts/start.sh:ro
    ports:
      - "9092:9092"
      - "9101:9101"
    depends_on:
      plugin-builder:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─── Kafka Init (topics + tenants) ─────────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.7.1
    platform: linux/arm64
    volumes:
      - ./scripts/init-kafka-topics.sh:/init-kafka-topics.sh:ro
    entrypoint: ["/bin/sh", "/init-kafka-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net
    restart: "no"

  # ─── Auth Service (Go) ──────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "kafka-realm"
      KEYCLOAK_CLIENT_ID: "auth-service"
      KEYCLOAK_CLIENT_SECRET: "auth-service-secret"
      KAFKA_CLIENT_ID: "kafka-client"
      KAFKA_CLIENT_SECRET: "kafka-client-secret"
      JWT_ISSUER: "http://keycloak:8080/realms/kafka-realm"
      TOKEN_EXCHANGE_TARGET_AUDIENCE: "kafka-broker"
      KAFKA_TOKEN_LIFETIME_SECONDS: "300"
      RATE_LIMIT_RPS: "100"
      LOG_LEVEL: "info"
      ENVIRONMENT: "production"
      ENABLE_METRICS: "true"
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Test Client (Go) ───────────────────────────────────────────────────────
  test-client:
    build:
      context: ./services/test-client
      dockerfile: Dockerfile
    environment:
      AUTH_SERVICE_URL: "http://auth-service:8080"
      KAFKA_BOOTSTRAP: "kafka:9092"
      KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
      KAFKA_SASL_MECHANISM: "OAUTHBEARER"
      TENANT_A_USER: "alice"
      TENANT_A_PASSWORD: "alice_password"
      TENANT_A_ID: "tenant-a"
      TENANT_B_USER: "bob"
      TENANT_B_PASSWORD: "bob_password"
      TENANT_B_ID: "tenant-b"
      LOG_LEVEL: "info"
    depends_on:
      auth-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net
    restart: on-failure

  # ─── OPA Policy Engine ──────────────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:0.65.0
    platform: linux/amd64
    command: ["run", "--server", "--log-level=info", "--addr=0.0.0.0:8181", "/policies", "/data"]
    volumes:
      - ./opa/policies:/policies:ro
      - ./opa/data:/data:ro
    ports:
      - "8181:8181"
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    platform: linux/arm64
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - kafka-net

  # ─── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    platform: linux/arm64
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - kafka-net
