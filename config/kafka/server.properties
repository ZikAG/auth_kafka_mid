############################# KRaft Mode #############################
node.id=1
process.roles=broker,controller
controller.quorum.voters=1@kafka:9091
controller.listener.names=CONTROLLER

############################# Listeners #############################
listeners=CONTROLLER://0.0.0.0:9091,SASL_PLAINTEXT://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092
advertised.listeners=SASL_PLAINTEXT://kafka:9092,PLAINTEXT://kafka:29092
listener.security.protocol.map=CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,PLAINTEXT:PLAINTEXT
inter.broker.listener.name=SASL_PLAINTEXT

############################# SASL/OAUTHBEARER #############################
sasl.enabled.mechanisms=OAUTHBEARER
sasl.mechanism.inter.broker.protocol=OAUTHBEARER

listener.name.sasl_plaintext.oauthbearer.sasl.jaas.config=\
  org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required \
  oauth.jwks.endpoint.uri="http://keycloak:8080/realms/kafka-realm/protocol/openid-connect/certs" \
  oauth.token.endpoint.uri="http://keycloak:8080/realms/kafka-realm/protocol/openid-connect/token" \
  oauth.client.id="kafka-broker" \
  oauth.client.secret="kafka-broker-secret" \
  oauth.valid.issuer.uri="http://keycloak:8080/realms/kafka-realm" \
  oauth.username.claim="sub";

listener.name.sasl_plaintext.oauthbearer.sasl.login.callback.handler.class=com.kafkaoauth.OAuthBearerLoginCallbackHandler
listener.name.sasl_plaintext.oauthbearer.sasl.server.callback.handler.class=com.kafkaoauth.OAuthBearerValidatorCallbackHandler

############################# Authorizer #############################
authorizer.class.name=com.kafkaoauth.authorizer.CustomKafkaAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:kafka-broker;User:admin
authorizer.super.users=User:kafka-broker;User:admin;User:ANONYMOUS

authorizer.opa.url=http://opa:8181/v1/data/kafka/authz/allow
authorizer.type=custom
authorizer.keycloak.jwks.uri=http://keycloak:8080/realms/kafka-realm/protocol/openid-connect/certs

############################# Topic Policy #############################
create.topic.policy.class.name=com.kafkaoauth.authorizer.TenantTopicPolicy

############################# Log / Storage #############################
log.dirs=/var/lib/kafka/data
log.retention.hours=168
auto.create.topics.enable=false

############################# Replication / Partitions #############################
num.partitions=3
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
quota.window.size.seconds=1
